name: Build & Push Docker Beta Image

on:
  push:
    branches: [v2-dev, v2.1-dev]
    tags: ["v*-beta*", "v*-rc*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ac13139/wan-ip-check
          tags: |
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/v2-dev' || github.ref == 'refs/heads/v2.1-dev' }}
            type=raw,value=v2-dev,enable=${{ github.ref == 'refs/heads/v2-dev' }}
            type=raw,value=v2.1-dev,enable=${{ github.ref == 'refs/heads/v2.1-dev' }}
            type=sha,prefix=beta-,format=short,enable=${{ github.ref == 'refs/heads/v2-dev' || github.ref == 'refs/heads/v2.1-dev' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
