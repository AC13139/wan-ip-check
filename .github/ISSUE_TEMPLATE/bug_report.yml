name: Bug report
description: Report a bug in wan-ip-check
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more concrete the report, the faster it gets fixed.
  - type: input
    id: version
    attributes:
      label: Version / tag
      description: Which image tag or build are you running (e.g. `2.0.0`, `latest`, or a `beta-<sha>`)?
      placeholder: e.g. 2.0.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Steps, config involved (WAN egress mode, action type + fields), and anything else needed to reproduce.
      placeholder: |
        1. Create a WAN interface with …
        2. Create an action of type …
        3. Trigger a check …
        4. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste relevant server logs or error messages. Redact any tokens or secrets.
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host (Docker / compose / binary), OS, architecture, and anything unusual about the network (NAT, VPN, proxy, macvlan).
      placeholder: |
        - Deployment: docker run / docker compose / bare binary
        - OS: …
        - Docker: NET_ADMIN added? yes/no
      value: |
        - Deployment:
        - OS:
        - NET_ADMIN: no
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have redacted any API tokens, webhook URLs, or other secrets from this report
          required: true
