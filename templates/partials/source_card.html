<div class="card" id="source-card-{{.Source.ID}}">
  <div class="card-header">
    <div class="flex-center gap-sm">
      <span class="status-dot {{.StatusClass}} pulse"></span>
      <span class="card-title">{{.Source.Name}}</span>
    </div>
    <button class="btn btn-sm btn-secondary"
            hx-post="/ui/sources/{{.Source.ID}}/check"
            hx-target="#source-card-{{.Source.ID}}"
            hx-swap="outerHTML">Check Now</button>
  </div>
  <div class="card-body">
    {{if .IP}}
    <div class="ip-display">{{.IP}}</div>
    {{else}}
    <div class="text-muted">No IP detected yet</div>
    {{end}}
  </div>
  <div class="card-footer flex-between">
    <div class="flex-center gap-md">
      {{if .LastCheck}}
      <span class="text-sm text-muted">Last check: {{.LastCheck}}</span>
      {{end}}
      <span class="badge {{.StatusBadgeClass}}">{{.StatusText}}</span>
    </div>
    <div class="flex-center gap-sm text-sm text-muted">
      <span class="mono-sm">{{.Source.Schedule}}</span>
      <span>{{.ActionCount}} actions</span>
    </div>
  </div>
</div>
