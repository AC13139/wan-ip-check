{{define "content"}}
<div class="card mb-lg" id="settings-form">
  <h3 class="section-title">Global Settings</h3>
  <form hx-put="/ui/settings" hx-target="#settings-form" hx-swap="outerHTML">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Daily Summary Time (HHMM)</label>
        <input type="text" name="daily_summary_time" class="form-input mono"
               value="{{.DailySummaryTime}}"
               placeholder="2000" maxlength="4" pattern="\d{4}">
        <div class="form-help">24-hour format. e.g., 2000 = 8:00 PM</div>
      </div>
      <div class="form-group">
        <label class="form-label">Timezone</label>
        <input type="text" name="timezone" class="form-input"
               value="{{.Timezone}}"
               placeholder="Asia/Shanghai or Local">
        <div class="form-help">IANA timezone name</div>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Save Settings</button>
  </form>
</div>

<div class="card">
  <h3 class="section-title">Encryption</h3>
  <div class="flex-center gap-md">
    <span class="badge badge-success">Active</span>
    <span class="text-sm text-secondary">Key stored at: <code class="mono-sm">{{.KeyPath}}</code></span>
  </div>
  <div class="form-help mt-lg">Secrets (API tokens, webhook URLs) are encrypted with AES-256-GCM before storing in the database. Back up the key file to avoid data loss.</div>
</div>
{{end}}
