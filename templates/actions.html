{{define "content"}}
<div class="card-grid" role="list">
  {{range .Actions}}
  <div class="card{{if not .Action.Enabled}} disabled{{end}}" id="action-card-{{.Action.ID}}" role="listitem">
    <div class="card-header">
      <div>
        <span class="card-title">{{.Action.Name}}</span>
        <div class="type-label">{{.Action.Type}}</div>
      </div>
      <label class="toggle">
        <input type="checkbox" {{if .Action.Enabled}}checked{{end}}
               hx-post="/ui/actions/{{.Action.ID}}/toggle"
               hx-target="#action-card-{{.Action.ID}}"
               hx-swap="outerHTML">
        <span class="toggle-track"></span>
        <span class="toggle-thumb"></span>
      </label>
    </div>
    <div class="card-body">
      {{if .LinkedWANInterfaces}}
      <div class="text-sm text-secondary mb-sm">
        Linked from: {{range $i, $s := .LinkedWANInterfaces}}{{if $i}}, {{end}}{{$s}}{{end}}
      </div>
      {{else}}
      <div class="text-sm text-muted mb-sm">Not linked to any WAN interface</div>
      {{end}}
      <div id="execute-result-{{.Action.ID}}" class="execute-result"></div>
    </div>
    <div class="card-footer">
      <a href="/actions/{{.Action.ID}}" class="btn btn-sm btn-secondary">Edit</a>
      <button class="btn btn-sm btn-secondary"
              {{if not .LinkedWANInterfaces}}disabled title="Link a WAN interface first"{{else}}title="Runs this action now for each linked WAN using its current observed IP"{{end}}
              hx-post="/ui/actions/{{.Action.ID}}/execute"
              hx-target="#execute-result-{{.Action.ID}}"
              hx-swap="innerHTML"
              hx-disabled-elt="this">Execute</button>
      <button class="btn btn-sm btn-danger"
              hx-delete="/ui/actions/{{.Action.ID}}"
              hx-target="#action-card-{{.Action.ID}}"
              hx-swap="delete"
              hx-confirm="Delete action '{{.Action.Name}}'?">Delete</button>
    </div>
  </div>
  {{end}}
  <a class="card card-add" href="/actions/new" role="listitem" aria-label="Add new action">
    <span class="card-add-plus">+</span>
    <span class="card-add-label">Add action</span>
  </a>
</div>
{{end}}
