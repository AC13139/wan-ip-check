services:
  wan-ip-check:
    image: ac13139/wan-ip-check:latest
    container_name: wan-ip-check
    restart: unless-stopped
    ports:
      - "7373:7373"   # Web UI + REST API + MCP at /mcp (single port)
    env_file:
      - .env
    volumes:
      - wan-ip-data:/app/data

volumes:
  wan-ip-data:
